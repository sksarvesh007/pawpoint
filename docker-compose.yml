# =============================================================================
# PawPoint Docker Compose - Local Development
# =============================================================================
# Usage:
#   Start all services:    docker compose up
#   Start backend only:    docker compose up backend
#   Start frontend only:   docker compose up frontend
#   Start app services:    docker compose up backend frontend
#   Rebuild after changes: docker compose up --build
#   Stop all services:     docker compose down
#   View logs with UI:     lazydocker (install with: brew install lazydocker)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development # Use 'production' for prod-like testing
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      # Prevent overwriting container's virtual env
      - /app/.venv
    environment:
      - APP_ENV=development
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0  # Use 'redis' hostname inside Docker network
      # CORS: Allow both local dev and production frontend URLs
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000,https://pawpoint-psi.vercel.app
    env_file:
      - ./backend/.env # Make sure to run 'cp backend/.env.example backend/.env' first!
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Prevent overwriting container's node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_LIVEKIT_WS_URL=ws://localhost:7880
      - NEXT_PUBLIC_ENABLE_VOICE=true
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL Database (local development only)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"  # Map to 5434 to avoid conflict with local PostgreSQL
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevonly}
      POSTGRES_DB: ${POSTGRES_DB:-pawpoint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawpoint -d pawpoint"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis Cache (for session management & AI chatbot)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO - S3-Compatible Object Storage (for call recordings)
  # Console: http://localhost:9001 (minioadmin/minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Worker (background tasks: chat analysis, session cleanup)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: uv run celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - APP_ENV=development
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ===========================================================================
  # LIVEKIT VOICE AI STACK
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # LiveKit Server - WebRTC Media Server
  # Handles real-time audio/video communication
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"               # HTTP/WebSocket API
      - "7881:7881"               # RTC over TCP
      - "50000-50020:50000-50020/udp"  # WebRTC UDP range (smaller for dev)
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml
    depends_on:
      - redis
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LiveKit SIP Service - Phone Call Integration
  # Routes Twilio SIP trunk calls to LiveKit rooms
  # ---------------------------------------------------------------------------
  livekit-sip:
    image: livekit/sip:latest
    ports:
      - "5060:5060/udp"           # SIP signaling
    volumes:
      - ./livekit-sip.yaml:/sip/config.yaml:ro
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SIP_REDIS_ADDRESS=redis:6379
    depends_on:
      - livekit
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LiveKit Agent Worker - Voice AI Processing
  # NOTE: Run locally for development (heavy ML dependencies)
  # cd backend && uv run python -m livekit_agent.main dev
  # ---------------------------------------------------------------------------
  # livekit-agent:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.agent
  #   environment:
  #     - LIVEKIT_URL=ws://livekit:7880
  #     - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
  #     - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
  #     - DATABASE_URL=postgresql+asyncpg://pawpoint:localdevonly@db:5432/pawpoint
  #     - REDIS_URL=redis://redis:6379/0
  #     - GOOGLE_API_KEY=${GOOGLE_API_KEY}
  #     - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
  #     - CARTESIA_API_KEY=${CARTESIA_API_KEY}
  #   depends_on:
  #     - livekit
  #     - db
  #     - redis

  # ===========================================================================
  # OBSERVABILITY STACK
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Grafana Alloy (OpenTelemetry Collector)
  # Receives OTLP data from the backend and forwards to Prometheus/Grafana
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:latest
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "12345:12345" # Alloy UI
    volumes:
      - ./observability/alloy-config.river:/etc/alloy/config.river:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Log collection from containers
    command: [ "run", "/etc/alloy/config.river", "--server.http.listen-addr=0.0.0.0:12345" ]
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Tempo - Distributed Tracing Backend
  # Stores and queries distributed traces from the backend
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.3.1
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "9095:9095"   # Tempo gRPC
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Loki - Log Aggregation
  # Collects and stores logs from Docker containers via Alloy
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"   # Loki HTTP API
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Storage
  # Scrapes /metrics from backend and stores time-series data
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--enable-feature=exemplar-storage'  # Enable exemplars for trace correlation
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana - Visualization Dashboard
  # Access at http://localhost:3001 (admin/admin)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:
  tempo_data:
  loki_data:
  minio_data:
  livekit_data:

