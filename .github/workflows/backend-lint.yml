name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**/*.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/backend-lint.yml"
      - ".pre-commit-config.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**/*.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/backend-lint.yml"
      - ".pre-commit-config.yaml"

jobs:
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Ruff linter
        run: uvx ruff check --output-format github .

      - name: Run Ruff formatter check
        run: uvx ruff format --check --diff .

  ty:
    name: ty Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Run ty type checker
        run: uvx ty check --python .venv --output-format github --error-on-warning .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pawpoint_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pawpoint_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://pawpoint_test:test_password@localhost:5432/pawpoint_test
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: PYTHONPATH=. uv run pytest -x -v --tb=short 2>&1
