[project]
name = "backend"
version = "0.1.0"
description = "Backend service for PawPoint, providing APIs for pet profiles, appointments, and user management."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pre-commit>=4.5.1",
    "ty>=0.0.12",
]

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
# Target Python version
target-version = "py313"

# Line length limit
line-length = 88
indent-width = 4

# Exclude directories from linting
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "migrations",
    "alembic/versions",
]

# Enable preview features for latest rules
preview = false

[tool.ruff.lint]
# Enable rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "B",     # flake8-bugbear
    "I",     # isort
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "T20",   # flake8-print
    "LOG",   # flake8-logging
]

# Disable specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function calls in argument defaults (needed for FastAPI Depends)
    "S101",   # Use of assert (allow in tests)
]

# Allow automatic fixes for all rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/**/*.py" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]

# isort configuration
[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true
split-on-trailing-comma = false
force-single-line = false

# flake8-bugbear configuration
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# McCabe complexity
[tool.ruff.lint.mccabe]
max-complexity = 10

# Formatter configuration
[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"

# Format docstring code examples
docstring-code-format = true
docstring-code-line-length = 80

# ============================================================================
# ty Type Checker Configuration
# ============================================================================
[tool.ty.environment]
# Python version to check against
python-version = "3.13"

# Target platform
python-platform = "all"

# First-party module search paths
root = ["./app", "./tests"]

[tool.ty.rules]
# Critical type safety errors
possibly-unresolved-reference = "error"
invalid-argument-type = "error"
missing-argument = "error"
unsupported-operator = "error"
division-by-zero = "error"

# Code quality warnings
unused-ignore-comment = "warn"
redundant-cast = "warn"
index-out-of-bounds = "warn"

[tool.ty.src]
# Include source directories (use "." to include all Python files)
include = ["."]

# Exclude patterns (gitignore syntax)
exclude = [
    "migrations/",
    "alembic/versions/",
    "*.proto",
    "__pycache__/",
]

# Respect .gitignore files
respect-ignore-files = true

[tool.ty.terminal]
# Output format: "full" or "concise"
output-format = "full"

# Don't fail on warnings in development
error-on-warning = false

# Relaxed rules for tests
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py", "**/*_test.py", "conftest.py"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"
missing-argument = "warn"

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]
