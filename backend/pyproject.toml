[project]
name = "backend"
version = "0.1.0"
description = "Backend service for PawPoint, providing APIs for pet profiles, appointments, and user management."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "pydantic-settings>=2.7.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9", # Sync driver for Alembic migrations
    "alembic>=1.13.0",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    # HTTP client for PIMS integrations
    "httpx>=0.27.0",
    # Redis for caching
    "redis>=5.0.0",
    # Background tasks
    "celery[redis]>=5.3.0",
    # OpenTelemetry Core
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    # OpenTelemetry Instrumentation
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    # OpenTelemetry Exporters
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-exporter-prometheus>=0.46b0",
    # Prometheus client for metrics endpoint
    "prometheus-client>=0.20.0",
    # Logging
    "loguru>=0.7.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Direct bcrypt for security utilities
    "bcrypt>=4.0.0",
    "sse-starlette>=3.2.0",
]

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
# Target Python version
target-version = "py313"

# Line length limit
line-length = 88
indent-width = 4

# Exclude directories from linting
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "migrations",
    "alembic/versions",
]

# Enable preview features for latest rules
preview = false

[tool.ruff.lint]
# Enable rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "B",     # flake8-bugbear
    "I",     # isort
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "T20",   # flake8-print
    "LOG",   # flake8-logging
]

# Disable specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Function calls in argument defaults (needed for FastAPI Depends)
    "S101",   # Use of assert (allow in tests)
]

# Allow automatic fixes for all rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]
"conftest.py" = ["S101"]

# isort configuration
[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true
split-on-trailing-comma = false
force-single-line = false

# flake8-bugbear configuration
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# McCabe complexity
[tool.ruff.lint.mccabe]
max-complexity = 10

# Formatter configuration
[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"

# Format docstring code examples
docstring-code-format = true
docstring-code-line-length = 80

# ============================================================================
# ty Type Checker Configuration
# ============================================================================
[tool.ty.environment]
# Python version to check against
python-version = "3.13"

# Target platform
python-platform = "all"

# First-party module search paths
root = ["./app", "./tests"]

[tool.ty.rules]
# Critical type safety errors
possibly-unresolved-reference = "error"
invalid-argument-type = "error"
missing-argument = "error"
unsupported-operator = "error"
division-by-zero = "error"

# Code quality warnings
unused-ignore-comment = "warn"
redundant-cast = "warn"
index-out-of-bounds = "warn"

[tool.ty.src]
# Include source directories (use "." to include all Python files)
include = ["."]

# Exclude patterns (gitignore syntax)
exclude = [
    "migrations/",
    "alembic/versions/",
    "*.proto",
    "__pycache__/",
]

# Respect .gitignore files
respect-ignore-files = true

[tool.ty.terminal]
# Output format: "full" or "concise"
output-format = "full"

# Don't fail on warnings in development
error-on-warning = false

# Relaxed rules for tests
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py", "**/*_test.py", "conftest.py"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"
missing-argument = "warn"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
