repos:
  # Ruff - Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        name: Ruff linter
        args: [--fix]
        files: ^backend/.*\.py$

      # Run the formatter
      - id: ruff-format
        name: Ruff formatter
        files: ^backend/.*\.py$

  # ty - Python type checker
  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: uvx ty check --python backend/.venv backend/app backend/livekit_agent
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/.*\.py$

  # Frontend ESLint
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && bun run lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|jsx)$

      - id: tsc
        name: TypeScript type check
        entry: bash -c 'cd frontend && bun run type-check'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
