# =============================================================================
# LiveKit Server Configuration
# For local development. Production requires additional security settings.
# =============================================================================

# HTTP/WebSocket server configuration
port: 7880

# RTC (Real-Time Communication) configuration
rtc:
  # Port range for WebRTC UDP connections
  port_range_start: 50000
  port_range_end: 50020

  # TCP fallback port for firewalled networks
  tcp_port: 7881

  # Use external IP for NAT traversal (important for Docker)
  use_external_ip: true

  # Enable ICE lite for server-side optimization
  # ice_lite: true

# API keys - set via environment variable LIVEKIT_KEYS in docker-compose
# Format: key:secret (e.g., APIxxxxxxxx:xxxxxxxxxxxxxxxx)
# keys:
#   APIxxxxxxxx: your-secret-here

# Redis for multi-node clustering and state management
redis:
  address: redis:6379

# Room configuration
room:
  # Room will be deleted after all participants leave
  empty_timeout: 60  # seconds

  # Maximum participants per room (for voice calls, usually 2-3)
  max_participants: 5

# Logging
logging:
  level: info
  # Set to debug for troubleshooting
  # level: debug

  # JSON logging for production
  # json: true

# Development mode settings
# In production, configure TURN servers for better connectivity
# turn:
#   enabled: true
#   domain: your-domain.com
#   tls_port: 5349
#   udp_port: 3478
