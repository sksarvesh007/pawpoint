# =============================================================================
# PawPoint Docker Compose - Local Development
# =============================================================================
# Usage:
#   Start all services:    docker compose up
#   Start backend only:    docker compose up backend
#   Start frontend only:   docker compose up frontend
#   Start app services:    docker compose up backend frontend
#   Rebuild after changes: docker compose up --build
#   Stop all services:     docker compose down
#   View logs with UI:     lazydocker (install with: brew install lazydocker)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development # Use 'production' for prod-like testing
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      # Prevent overwriting container's virtual env
      - /app/.venv
    environment:
      - APP_ENV=development
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0  # Use 'redis' hostname inside Docker network
    env_file:
      - ./backend/.env # Make sure to run 'cp backend/.env.example backend/.env' first!
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Prevent overwriting container's node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL Database (local development only)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"  # Map to 5434 to avoid conflict with local PostgreSQL
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevonly}
      POSTGRES_DB: ${POSTGRES_DB:-pawpoint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawpoint -d pawpoint"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis Cache (for session management & AI chatbot)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # OBSERVABILITY STACK
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Grafana Alloy (OpenTelemetry Collector)
  # Receives OTLP data from the backend and forwards to Prometheus/Grafana
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:latest
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "12345:12345" # Alloy UI
    volumes:
      - ./observability/alloy-config.river:/etc/alloy/config.river:ro
    command: [ "run", "/etc/alloy/config.river", "--server.http.listen-addr=0.0.0.0:12345" ]
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Storage
  # Scrapes /metrics from backend and stores time-series data
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana - Visualization Dashboard
  # Access at http://localhost:3001 (admin/admin)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:

