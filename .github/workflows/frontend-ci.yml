name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run type-check

      - name: Build
        run: bun run build

  deploy-preview:
    needs: build-and-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: Preview
    defaults:
      run:
        working-directory: ./frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Pull Vercel Environment Information
        run: bun x vercel pull --yes --environment=preview

      - name: Build Project Artifacts
        run: bun x vercel build

      - name: Deploy Project Artifacts to Vercel
        run: bun x vercel deploy --prebuilt

  deploy-production:
    needs: build-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: ./frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Pull Vercel Environment Information
        run: bun x vercel pull --yes --environment=production

      - name: Build Project Artifacts
        run: bun x vercel build --prod

      - name: Deploy Project Artifacts to Vercel
        run: bun x vercel deploy --prebuilt --prod
