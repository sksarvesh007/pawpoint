repos:
  # Ruff - Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        name: Ruff linter
        args: [--fix]
        files: \.py$

      # Run the formatter
      - id: ruff-format
        name: Ruff formatter
        files: \.py$

  # ty - Python type checker
  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false
