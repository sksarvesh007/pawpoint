# Grafana Dashboard Provisioning
# Automatically loads dashboards from the dashboards folder

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'PawPoint'
    folderUid: 'pawpoint'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
